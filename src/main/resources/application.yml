# =============================================================================
# Portal Backend Service (MSA) - Multi Profile Configuration
# =============================================================================
# Profiles: local / dev / prd
# Note: Production would typically use MySQL/MariaDB + HikariCP.
#       All active profiles currently use H2 in-memory for zero connection errors.
# =============================================================================

spring:
  application:
    name: portal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# -----------------------------------------------------------------------------
# local : local development (H2)
# real example (unused): jdbc:mysql://localhost:3306/portal_local
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # enterprise-mysql-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portal}?useSSL=false&serverTimezone=Asia/Seoul
    url: jdbc:h2:mem:portal_local;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: PortalHikariPool-Local
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: INFO
    com.example.backend: DEBUG

# -----------------------------------------------------------------------------
# dev : development server (documented MySQL, runtime H2)
# real example (unused): jdbc:mysql://dev-db:3306/portal_dev + HikariCP
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # enterprise-mysql-url: jdbc:mysql://${DB_HOST:dev-db}:${DB_PORT:3306}/${DB_NAME:portal_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    # enterprise-username: ${DB_USERNAME:portal}
    # enterprise-password: ${DB_PASSWORD:portal}
    url: jdbc:h2:mem:portal_dev;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: PortalHikariPool-Dev
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: INFO
    com.example.backend: DEBUG

# -----------------------------------------------------------------------------
# prd : production (documented MySQL + strict validation, runtime H2)
# real example (unused): jdbc:mysql://prd-db:3306/portal + SSL + ddl-auto=validate
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: prd
  datasource:
    # enterprise-mysql-url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul
    # enterprise-username: ${DB_USERNAME}
    # enterprise-password: ${DB_PASSWORD}
    url: jdbc:h2:mem:portal_prd;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: PortalHikariPool-Prd
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 3000
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # production docs: validate / demo stability: update
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: WARN
    com.example.backend: INFO
