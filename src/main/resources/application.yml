# =============================================================================
# Portal Backend Service (MSA) - Multi Profile Configuration
# =============================================================================
# Profiles: local / dev / prd
# Sensitive values are injected via environment variables.
# All profiles default to H2 file-based DB for persistence across restarts.
# =============================================================================

spring:
  application:
    name: portal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Actuator: expose health only. Never expose env / heapdump.
management:
  endpoints:
    web:
      exposure:
        include: health
        exclude: env,heapdump,threaddump,logfile,shutdown,beans,conditions,configprops,mappings,metrics,prometheus
  endpoint:
    health:
      show-details: never
    env:
      enabled: false
    heapdump:
      enabled: false

# -----------------------------------------------------------------------------
# local
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/portaldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: PortalHikariPool-Local
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.backend: ${LOG_LEVEL_APP:DEBUG}

# -----------------------------------------------------------------------------
# dev
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/portaldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: PortalHikariPool-Dev
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.backend: ${LOG_LEVEL_APP:DEBUG}

# -----------------------------------------------------------------------------
# prd
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: prd
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/portaldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: PortalHikariPool-Prd
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 3000
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.example.backend: ${LOG_LEVEL_APP:INFO}
