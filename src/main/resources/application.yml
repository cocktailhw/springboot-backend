# =============================================================================
# Portal Backend Service (MSA) - Common Configuration
# =============================================================================
# Profiles: local / dev / prd (default: local)
# Sensitive values are injected via environment variables.
# =============================================================================

spring:
  application:
    name: portal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio-service:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:portal-uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:true}

# K8s Secret 등으로 BCrypt 해시 주입 (평문 비밀번호 금지)
auth:
  admin:
    password-hash: ${AUTH_ADMIN_PASSWORD_HASH}
  user:
    password-hash: ${AUTH_USER_PASSWORD_HASH}

# 쿠키 기반 JWT CORS: allowCredentials=true 이므로 origin 와일드카드(*) 불가
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# Actuator: expose health/prometheus only. Never expose env / heapdump.
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
        exclude: env,heapdump,threaddump,logfile,shutdown,beans,conditions,configprops,mappings
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      enabled: false
    heapdump:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:backend-app}
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
